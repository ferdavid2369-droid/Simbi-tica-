<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simbiótica</title>
  <style>
    :root {
      --crt-tint: rgba(255, 255, 240, 0.03);
      --amber-warm: #f3dfa2;
      --bg-canvas: #12181b;
      --panel-bg: rgba(26, 32, 38, 0.94);
      --border-wood: #7d6b53;
      --accent-sun: #e9b44c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%;
      height: 100%;
      background-color: var(--bg-canvas);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: "Courier New", Courier, monospace;
      color: #ede6d6;
    }
    #viewport-container {
      position: relative;
      width: 960px;
      height: 640px;
      background: #000;
      box-shadow: 0 0 60px rgba(0,0,0,0.9), 0 0 20px rgba(233, 180, 76, 0.15);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .crt-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.22) 50%), 
                  linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
      background-size: 100% 3px, 5px 100%;
      pointer-events: none;
      box-shadow: inset 0 0 70px rgba(0,0,0,0.7);
    }
    #ui-layer {
      position: absolute;
      bottom: 20px;
      left: 3%;
      width: 94%;
      min-height: 195px;
      background: var(--panel-bg);
      border: 2px solid var(--border-wood);
      box-shadow: 0 0 0 1px #221c15, inset 0 0 16px rgba(0,0,0,0.85);
      padding: 16px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: blur(4px);
    }
    #header-status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #4a4135;
      padding-bottom: 6px;
      margin-bottom: 8px;
    }
    #speaker-tag {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent-sun);
      font-weight: bold;
    }
    #community-meter {
      font-size: 12px;
      color: #9eb39c;
      letter-spacing: 1px;
    }
    #dialogue-text {
      font-size: 15px;
      line-height: 1.55;
      color: #f7f4ea;
      min-height: 75px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.9);
    }
    #options-container {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .choice-btn {
      background: #252b33;
      border: 1px solid #576270;
      color: #ede6d6;
      padding: 7px 14px;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .choice-btn:hover {
      background: #3e4854;
      color: #fff;
      border-color: var(--accent-sun);
    }
    #init-overlay {
      position: absolute;
      inset: 0;
      background: #14181c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      cursor: pointer;
      text-align: center;
      padding: 24px;
    }
  </style>
</head>
<body>

  <div id="viewport-container">
    <canvas id="gameCanvas" width="480" height="320"></canvas>
    <div class="crt-overlay"></div>
    
    <div id="ui-layer">
      <div id="header-status">
        <div id="speaker-tag">Aurelio</div>
        <div id="community-meter">Tejido Comunal: Activo</div>
      </div>
      <div id="dialogue-text"></div>
      <div id="options-container"></div>
    </div>

    <div id="init-overlay">
      <h1 style="letter-spacing: 5px; margin-bottom: 12px; color: #e9b44c; font-size: 28px;">SIMBIÓTICA</h1>
      <p style="font-size: 13px; max-width: 480px; line-height: 1.6; color: #b0a898;">
        "El surco, la red, el cosmos y el pan responden al mismo latido."<br><br>
        Toca para despertar a la mañana soleada.
      </p>
    </div>
  </div>

  <script>
    /* -----------------------------------------------------------
       PAISAJE SONORO PROCEDURAL: DÍA SOLEADO Y TONOS CÁLIDOS
    ----------------------------------------------------------- */
    class SimbioticaAudio {
      constructor() {
        this.ctx = null;
        this.started = false;
      }
      init() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.started = true;
        this.playWarmDrone();
        this.startBirdChirps();
      }
      playWarmDrone() {
        // Acorde mayor cálido sostenido (Do mayor novena: C - G - D - E)
        const freqs = [130.81, 196.00, 293.66, 329.63];
        freqs.forEach(f => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.008, this.ctx.currentTime);
          
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(450, this.ctx.currentTime);
          
          osc.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
        });
      }
      triggerTextChime() {
        if (!this.started) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520 + Math.random() * 50, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.012, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.06);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.06);
      }
      startBirdChirps() {
        setInterval(() => {
          if (!this.started || Math.random() > 0.4) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          const baseF = 1800 + Math.random() * 600;
          osc.frequency.setValueAtTime(baseF, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(baseF + 400, this.ctx.currentTime + 0.08);
          osc.frequency.exponentialRampToValueAtTime(baseF - 200, this.ctx.currentTime + 0.16);
          gain.gain.setValueAtTime(0.015, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.18);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.18);
        }, 3600);
      }
    }

    /* -----------------------------------------------------------
       NARRATIVA Y ACCIONES: DE LO COTIDIANO A LA ONTOLOGÍA SIMBIÓTICA
    ----------------------------------------------------------- */
    const narrative = {
      start: {
        speaker: "Aurelio",
        text: "¡Buen día! Qué lindo sol entibia la huerta hoy. Estaba por pelar unas cebollas para una olla comunitaria y separar la cosecha de calabazas para la feria de la tarde. ¿Me das una mano con los quehaceres?",
        choices: [
          { text: "Cocinar contigo el guiso para el pueblo.", target: "quehacer_cocinar" },
          { text: "Cargar las calabazas para llevarlas al mercado.", target: "quehacer_mercado" },
          { text: "Mirar el cielo y descansar un rato.", target: "quehacer_ocio" }
        ]
      },
      quehacer_cocinar: {
        speaker: "Aurelio",
        text: "Picá fino el zapallo, hijo. Cocinar para otros te enseña algo humilde: al elegir revolver esta olla durante dos horas, renunciamos a desmalezar el trigo. Cada acto humano carga con un costo de oportunidad; nada es gratis en el tiempo, pero la entrega hace que el costo sea pura fertilidad.",
        choices: [
          { text: "¿Por qué no cocinar solo para ti y ahorrar tiempo?", target: "filosofia_lenguaje" },
          { text: "¿Crees que estaba destinado a picar esta verdura hoy?", target: "filosofia_destino" }
        ]
      },
      quehacer_mercado: {
        speaker: "Aurelio",
        text: "Cuidado con esa cesta, que las calabazas están pesadas. Las llevo al mercado no por ambición de monedas secas, sino porque necesito el aceite del molinero y las telas de doña Rosa. Quien produce sin mirar al prójimo se marchita en su propio egoísmo; el mercado sano es un abrazo entre oficios.",
        choices: [
          { text: "O sea que el valor no existe sin una comunidad que lo reconozca.", target: "filosofia_lenguaje" },
          { text: "A veces siento que no elijo mis tareas, sino que la vida me arrastra.", target: "filosofia_destino" }
        ]
      },
      quehacer_ocio: {
        speaker: "Aurelio",
        text: "La pausa también es faena, mientras no sea desdén del prójimo. Mirás las nubes correr... Parecen libres, pero siguen el pulso invisible de los vientos y la presión. Nosotros creemos decidir cada paso con soberbia, pero respiramos al compás de leyes que no escribimos.",
        choices: [
          { text: "¿Dónde queda entonces nuestra voluntad libre?", target: "filosofia_destino" },
          { text: "Aun descansando, te escucho hablar y entiendo tus signos.", target: "filosofia_lenguaje" }
        ]
      },
      filosofia_lenguaje: {
        speaker: "Aurelio",
        text: "¿Te diste cuenta de que ni siquiera podrías pensar lo que me estás diciendo si no hubiese existido un pueblo antes que vos para inventar las palabras? Un hombre solo en una selva jamás inventa un idioma propio; no hay lenguaje privado. Pensar ya es agradecer a los que vivieron antes.",
        choices: [
          { text: "Somos el eco de una trama colectiva.", target: "filosofia_red" },
          { text: "¿Y si esta charla fuese apenas un sueño o un juego?", target: "filosofia_liminal" }
        ]
      },
      filosofia_destino: {
        speaker: "Aurelio",
        text: "El cauce del río es el destino cósmico, la gravedad inevitable; pero la forma en que remamos la barca y a quiénes subimos a bordo es nuestra santa voluntad. La comunidad organizada nace de esa armonía: respetar el límite natural, pero encender el corazón para que nadie se ahogue.",
        choices: [
          { text: "Como las raíces que necesitan de la tierra entera.", target: "filosofia_red" },
          { text: "Tu rostro me resulta familiar y extraño a la vez...", target: "filosofia_liminal" }
        ]
      },
      filosofia_red: {
        speaker: "Aurelio",
        text: "Escuchame bien, viajero: yo no existo suelto. Esta huerta necesita del feriante, el feriante del herrero, y vos... vos que me mirás desde el otro lado de esa pantalla luminosa. Tu 'red' virtual no flota en la nada; necesita generadores, cables bajo el océano, trabajadores limpiando paneles, un planeta con aire puro y un cosmos que mantenga los átomos en su sitio.",
        choices: [
          { text: "La informática es biología y geología encarnada.", target: "filosofia_liminal" },
          { text: "Todo es simbiótico. Nada subsiste en soledad.", target: "filosofia_cosmos" }
        ]
      },
      filosofia_liminal: {
        speaker: "Aurelio",
        text: "(Aurelio sonríe con una mirada dulce y tibia). ¿Sentís el calor de este sol dibujado? ¿Quién sueña a quién? Quizás yo soy un algoritmo labrado con tus nostalgias, o quizás sos vos quien recuerda, desde un futuro mecánico, la mañana en que aprendiste a cosechar con tus abuelos. Lo virtual y lo vivo se abrazan si hay cariño.",
        choices: [
          { text: "¿Hacia dónde va esta gran red de la vida?", target: "filosofia_cosmos" }
        ]
      },
      filosofia_cosmos: {
        speaker: "Aurelio",
        text: "Va hacia la comunión, forastero. Si se quiebra la tierra, se apaga la red; si se apaga la comunidad, el hombre vuelve a ser una fiera hambrienta. Cuidá tu plaza, amá tu barrio y no olvides que cada tecla que tocás hace vibrar a las estrellas. Ahora vení, que el guiso ya huele a gloria.",
        choices: [
          { text: "Sentarse a la mesa comunal y volver a empezar el día.", target: "start" }
        ]
      }
    };

    /* -----------------------------------------------------------
       RENDERIZADO: PAISAJE SOLEADO Y RETRATO PRIMER PLANO DEL ANCIANO
    ----------------------------------------------------------- */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let frame = 0;

    function render() {
      frame++;

      // 1. CIELO SOLEADO Y RADIANTE (Mitad izquierda: Paisaje campestre)
      const skyGrad = ctx.createLinearGradient(0, 0, 0, 160);
      skyGrad.addColorStop(0, '#56a3db');
      skyGrad.addColorStop(0.6, '#93cbdf');
      skyGrad.addColorStop(1, '#e4f4f7');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, 260, 160);

      // Sol brillante diurno con fulgor pulsante
      const sunPulse = Math.sin(frame * 0.04) * 2;
      ctx.fillStyle = '#fff4a3';
      ctx.beginPath();
      ctx.arc(60, 45, 20 + sunPulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255, 245, 170, 0.3)';
      ctx.beginPath();
      ctx.arc(60, 45, 34 + sunPulse, 0, Math.PI * 2);
      ctx.fill();

      // Nubes suaves diurnas
      ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
      ctx.fillRect(110, 30, 40, 10);
      ctx.fillRect(120, 24, 25, 12);
      ctx.fillRect(180, 50, 50, 8);

      // Colinas soleadas verdes y huerta en hilera
      ctx.fillStyle = '#61994e';
      ctx.beginPath();
      ctx.moveTo(0, 160);
      for (let x = 0; x <= 260; x += 10) {
        ctx.lineTo(x, 120 + Math.sin(x * 0.02) * 12);
      }
      ctx.lineTo(260, 160);
      ctx.fill();

      // Tierra arada viva y huerta con surcos
      ctx.fillStyle = '#4a3728';
      ctx.fillRect(0, 150, 260, 170);

      ctx.strokeStyle = '#634b35';
      ctx.lineWidth = 3;
      for (let i = -40; i < 280; i += 24) {
        ctx.beginPath();
        ctx.moveTo(i, 150);
        ctx.lineTo(i * 1.4 - 30, 320);
        ctx.stroke();
      }

      // Calabazas / frutos dorados en la huerta
      ctx.fillStyle = '#d97d29';
      for (let b = 20; b < 240; b += 45) {
        ctx.beginPath();
        ctx.arc(b, 200 + (b % 30), 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#3c6e28';
        ctx.fillRect(b - 1, 193 + (b % 30), 2, 3);
        ctx.fillStyle = '#d97d29';
      }

      // 2. RETRATO PRIMER PLANO DEL ANCIANO (Mitad derecha: Fondo cálido de madera/hogar)
      ctx.fillStyle = '#221a15';
      ctx.fillRect(260, 0, 220, 320);

      // Marco rústico que divide el mundo exterior y el encuentro íntimo
      ctx.fillStyle = '#3d2e24';
      ctx.fillRect(256, 0, 6, 320);

      const breathing = Math.sin(frame * 0.035) * 1.5;
      const ox = 320;
      const oy = 40 + breathing;

      // Hombros y poncho/camisa de labor campesina
      ctx.fillStyle = '#7a5a3a';
      ctx.beginPath();
      ctx.moveTo(ox - 50, 290);
      ctx.lineTo(ox + 120, 290);
      ctx.lineTo(ox + 90, 180);
      ctx.lineTo(ox - 20, 180);
      ctx.fill();

      // Cuello y pañuelo claro
      ctx.fillStyle = '#c7b299';
      ctx.fillRect(ox + 18, oy + 120, 34, 18);

      // Rostro: Tono piel tostado y cálido
      ctx.fillStyle = '#dca87e';
      ctx.fillRect(ox + 10, oy + 40, 52, 65);
      ctx.fillRect(ox + 4, oy + 55, 64, 42); // Pómulos amables y mejillas

      // Pelo lateral canoso
      ctx.fillStyle = '#ebe6de';
      ctx.fillRect(ox + 2, oy + 42, 8, 35);
      ctx.fillRect(ox + 62, oy + 42, 8, 35);

      // Sombrero de paja luminoso (iluminado por el sol)
      ctx.fillStyle = '#dfb15b';
      ctx.fillRect(ox - 16, oy + 32, 104, 12);
      ctx.fillRect(ox + 4, oy + 10, 64, 24);
      ctx.fillStyle = '#8f4f29'; // Cinta del sombrero
      ctx.fillRect(ox + 4, oy + 28, 64, 5);

      // Cejas tupidas y blancas, con inclinación amable y tierna
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(ox + 16, oy + 56, 14, 4);
      ctx.fillRect(ox + 42, oy + 56, 14, 4);

      // Ojos dulces: Parpadeo procedural pausado
      const blink = (frame % 180 > 174);
      if (blink) {
        ctx.fillStyle = '#5c3826';
        ctx.fillRect(ox + 18, oy + 65, 11, 2);
        ctx.fillRect(ox + 43, oy + 65, 11, 2);
      } else {
        // Mirada vivaz, cálida y arrugada en los bordes
        ctx.fillStyle = '#3a2312';
        ctx.fillRect(ox + 19, oy + 63, 8, 7);
        ctx.fillRect(ox + 44, oy + 63, 8, 7);
        // Brillo en los ojos (sensación de dulzura consciente)
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(ox + 21, oy + 64, 2, 2);
        ctx.fillRect(ox + 46, oy + 64, 2, 2);
        // Patas de gallo / arrugas de sonrisa
        ctx.fillStyle = '#b7835c';
        ctx.fillRect(ox + 14, oy + 65, 3, 2);
        ctx.fillRect(ox + 54, oy + 65, 3, 2);
      }

      // Nariz redonda y noble
      ctx.fillStyle = '#c7926b';
      ctx.fillRect(ox + 31, oy + 68, 10, 14);

      // Bigote espeso y barba blanca venerable y esponjosa
      ctx.fillStyle = '#f0ede6';
      ctx.fillRect(ox + 20, oy + 82, 32, 10);
      ctx.fillRect(ox + 16, oy + 90, 40, 24);
      ctx.fillRect(ox + 22, oy + 112, 28, 12);

      // Sonrisa afable y arrugas de calidez
      ctx.fillStyle = '#9e6443';
      ctx.fillRect(ox + 28, oy + 88, 16, 3);

      // Destellos sutiles de polen dorado flotando en el aire soleado
      ctx.fillStyle = 'rgba(240, 220, 140, 0.6)';
      for (let p = 0; p < 12; p++) {
        const px = (Math.sin(p * 55 + frame * 0.02) * 0.5 + 0.5) * 250;
        const py = (Math.cos(p * 27 + frame * 0.025) * 0.5 + 0.5) * 200;
        ctx.fillRect(px, py, 2, 2);
      }

      requestAnimationFrame(render);
    }

    /* -----------------------------------------------------------
       MOTOR DIALÓGICO Y MÁQUINA DE ESTADOS
    ----------------------------------------------------------- */
    const sound = new SimbioticaAudio();
    let currentNode = 'start';
    let isTyping = false;
    let typeTimer = null;

    const dialogueTextElem = document.getElementById('dialogue-text');
    const optionsContainer = document.getElementById('options-container');
    const speakerTag = document.getElementById('speaker-tag');
    const initOverlay = document.getElementById('init-overlay');

    function renderDialogue(nodeKey) {
      const node = narrative[nodeKey];
      currentNode = nodeKey;
      speakerTag.textContent = node.speaker || "Aurelio";
      dialogueTextElem.innerHTML = "";
      optionsContainer.innerHTML = "";

      let charIndex = 0;
      isTyping = true;
      clearInterval(typeTimer);

      typeTimer = setInterval(() => {
        if (charIndex < node.text.length) {
          dialogueTextElem.textContent += node.text[charIndex];
          if (charIndex % 2 === 0) sound.triggerTextChime();
          charIndex++;
        } else {
          clearInterval(typeTimer);
          isTyping = false;
          displayChoices(node.choices);
        }
      }, 22);
    }

    function displayChoices(choices) {
      optionsContainer.innerHTML = "";
      choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = `▶ ${choice.text}`;
        btn.onclick = () => {
          if (isTyping) {
            clearInterval(typeTimer);
            dialogueTextElem.textContent = narrative[currentNode].text;
            isTyping = false;
            displayChoices(choices);
          } else {
            renderDialogue(choice.target);
          }
        };
        optionsContainer.appendChild(btn);
      });
    }

    initOverlay.addEventListener('click', () => {
      sound.init();
      initOverlay.style.opacity = '0';
      setTimeout(() => initOverlay.style.display = 'none', 500);
      render();
      renderDialogue('start');
    });
  </script>
</body>
</html>
